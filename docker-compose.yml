services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: roadsense
      POSTGRES_PASSWORD: roadsense
      POSTGRES_DB: roadsense
    ports:
      - "5432:5432"
    volumes:
      - roadsense_pgdata:/var/lib/postgresql/data
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://roadsense:roadsense@db:5432/roadsense
      FRONTEND_ORIGIN: http://localhost:5173
      ROADSENSE_RAW_DIR: /data/raw
      ROADSENSE_PROCESSED_DIR: /data/processed
      ROADSENSE_ARTIFACTS_DIR: /artifacts
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
      - ./backend/artifacts:/app/artifacts
    depends_on:
      - db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
volumes:
  roadsense_pgdata:
